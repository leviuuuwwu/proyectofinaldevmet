name: Continuous Deployment

on:
  workflow_run:
    workflows: ["App Delivery"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to search-dev
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          AUTH_TOKENS_JSON: ${{ secrets.AUTH_TOKENS_JSON }}
        run: |
          cd deploy/overlays/dev
          kustomize edit set image "ghcr.io/leviuuuwwu/search-api=ghcr.io/${{ github.repository_owner }}/search-api:${IMAGE_SHA}"

          # 1. Crear o actualizar secretos de forma idempotente
          kubectl -n search-dev create secret generic postgres-credentials \
            --from-literal=POSTGRES_USER=search \
            --from-literal=POSTGRES_DB=search \
            --from-literal=POSTGRES_PASSWORD="$PG_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n search-dev create secret generic app-secrets \
            --from-literal=DATABASE_URL="postgres://search:${PG_PASSWORD}@postgres:5432/search" \
            --from-literal=AUTH_TOKENS_JSON="$AUTH_TOKENS_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. Borrar job de migracion previo
          kubectl delete job db-migration -n search-dev --ignore-not-found=true

          # 3. Aplicar manifiestos y esperar a PostgreSQL
          kubectl apply -k .
          kubectl -n search-dev rollout status statefulset/postgres --timeout=120s

          # 4. Esperar migraciones y validar deployments
          kubectl wait --for=condition=complete --timeout=120s job/db-migration -n search-dev
          kubectl rollout status deployment/search-api -n search-dev --timeout=120s
          kubectl rollout status deployment/search-indexer -n search-dev --timeout=120s
