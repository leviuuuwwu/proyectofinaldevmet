name: Continuous Deployment

# Despliega a search-dev cada imagen construida en main, o (manual) un commit concreto
# de main ya construido: redespliegue o rollback trazable (DEV-12). El job de kubectl
# corre en el runner self-hosted de la VM (ADR 0006) con una identidad limitada a
# search-dev. Nunca se dispara por pull_request.
on:
  workflow_run:
    workflows: ["App Delivery CI/CD"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Commit SHA (40 hex) de main con imagen ya construida (rollback o redespliegue)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # Valida en un runner de GitHub qué commit se despliega; el runner de la VM solo
  # recibe un SHA ya verificado.
  resolve:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify the commit to deploy
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.image_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$RUN_SHA"
          if [ "$EVENT" = workflow_dispatch ]; then
            SHA="$INPUT_SHA"
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_sha debe ser un SHA de 40 hex"; exit 1; }
            git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA no está en main"; exit 1; }
            ok=$(gh run list --workflow app-delivery.yml --commit "$SHA" --status success --json databaseId --jq length)
            [ "$ok" -gt 0 ] || { echo "::error::No hay build exitoso de la imagen para $SHA"; exit 1; }
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy-dev:
    needs: resolve
    runs-on: [self-hosted, linux, k3s-cluster]
    environment: development
    steps:
      - name: Checkout the commit to deploy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      # The runner is persistent: kubectl's discovery cache from an earlier run does not
      # know CRDs installed later (PodMonitor -> "no matches for kind"). Fresh per job.
      - name: Use a per-job kubectl cache
        run: echo "KUBECACHEDIR=$RUNNER_TEMP/kube-cache" >> "$GITHUB_ENV"

      - name: Deploy to search-dev
        env:
          NS: search-dev
          IMAGE_SHA: ${{ needs.resolve.outputs.sha }}
          OWNER: ${{ github.repository_owner }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          AUTH_TOKENS_JSON: ${{ secrets.AUTH_TOKENS_JSON }}
        run: |
          set -euo pipefail
          cd deploy/overlays/dev
          # Imagen exacta del commit (kustomize integrado en kubectl; sin binario extra).
          cat >> kustomization.yaml <<EOF
          images:
            - name: ghcr.io/leviuuuwwu/search-api
              newName: ghcr.io/${OWNER}/search-api
              newTag: ${IMAGE_SHA}
          EOF

          # 1. Secrets (idempotente)
          kubectl -n "$NS" create secret generic postgres-credentials \
            --from-literal=POSTGRES_USER=search \
            --from-literal=POSTGRES_DB=search \
            --from-literal=POSTGRES_PASSWORD="$PG_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NS" create secret generic app-secrets \
            --from-literal=DATABASE_URL="postgres://search:${PG_PASSWORD}@postgres:5432/search" \
            --from-literal=AUTH_TOKENS_JSON="$AUTH_TOKENS_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. El Job es inmutable: se borra antes de volver a aplicarlo
          kubectl -n "$NS" delete job db-migration --ignore-not-found=true

          # 3. Manifiestos; PostgreSQL primero, luego migraciones, luego la app
          kubectl apply -k .
          kubectl -n "$NS" rollout status statefulset/postgres --timeout=120s
          kubectl -n "$NS" wait --for=condition=complete --timeout=120s job/db-migration
          kubectl -n "$NS" rollout status deployment/search-api --timeout=120s
          kubectl -n "$NS" rollout status deployment/search-indexer --timeout=120s

      # The app does not depend on the observability stack: the PodMonitor is applied
      # only if its CRD exists; otherwise the run gets a visible warning.
      - name: Apply PodMonitor (if the CRD is installed)
        env:
          NS: search-dev
        run: |
          echo "monitoring.coreos.com resources visible to this runner:"
          kubectl api-resources --api-group=monitoring.coreos.com -o name || true
          if kubectl api-resources --api-group=monitoring.coreos.com -o name | grep -qx 'podmonitors.monitoring.coreos.com'; then
            kubectl -n "$NS" apply -f deploy/monitoring/pod-monitor.yaml
          else
            echo "::warning::CRD PodMonitor no instalado: Prometheus no recolecta la app (revisar kube-prometheus-stack, infra/scripts/platform-install.sh)"
          fi

      # On failure, print state, events and logs (4.1 "Diagnóstico"): no SSH needed to
      # see why a rollout or the migration Job did not finish. Read-only.
      - name: Diagnose on failure
        if: failure()
        env:
          NS: search-dev
        run: deploy/scripts/diagnose.sh "$NS"

      - name: Summary
        env:
          IMAGE_SHA: ${{ needs.resolve.outputs.sha }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: echo "Desplegado \`$IMAGE_SHA\` en search-dev ($EVENT, @$ACTOR)" >> "$GITHUB_STEP_SUMMARY"
