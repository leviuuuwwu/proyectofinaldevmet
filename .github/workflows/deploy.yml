name: Continuous Deployment

# Despliega a search-dev cada imagen construida en main. El job corre en el runner
# self-hosted de la VM (ADR 0006), con un kubeconfig limitado a search-dev y
# search-prod (deploy/cluster/ci-deployer.yaml). Nunca se dispara por pull_request.
on:
  workflow_run:
    workflows: ["App Delivery CI/CD"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: [self-hosted, linux, k3s-cluster]
    environment: development
    steps:
      - name: Checkout the built commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Deploy to search-dev
        env:
          NS: search-dev
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
          OWNER: ${{ github.repository_owner }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          AUTH_TOKENS_JSON: ${{ secrets.AUTH_TOKENS_JSON }}
        run: |
          set -euo pipefail
          cd deploy/overlays/dev
          # Imagen exacta del commit (kustomize integrado en kubectl; sin binario extra).
          cat >> kustomization.yaml <<EOF
          images:
            - name: ghcr.io/leviuuuwwu/search-api
              newName: ghcr.io/${OWNER}/search-api
              newTag: ${IMAGE_SHA}
          EOF

          # 1. Secrets (idempotente)
          kubectl -n "$NS" create secret generic postgres-credentials \
            --from-literal=POSTGRES_USER=search \
            --from-literal=POSTGRES_DB=search \
            --from-literal=POSTGRES_PASSWORD="$PG_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NS" create secret generic app-secrets \
            --from-literal=DATABASE_URL="postgres://search:${PG_PASSWORD}@postgres:5432/search" \
            --from-literal=AUTH_TOKENS_JSON="$AUTH_TOKENS_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. El Job es inmutable: se borra antes de volver a aplicarlo
          kubectl -n "$NS" delete job db-migration --ignore-not-found=true

          # 3. Manifiestos; PostgreSQL primero, luego migraciones, luego la app
          kubectl apply -k .
          kubectl -n "$NS" rollout status statefulset/postgres --timeout=120s
          kubectl -n "$NS" wait --for=condition=complete --timeout=120s job/db-migration
          kubectl -n "$NS" rollout status deployment/search-api --timeout=120s
          kubectl -n "$NS" rollout status deployment/search-indexer --timeout=120s

      - name: Summary
        env:
          IMAGE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "Desplegado \`$IMAGE_SHA\` en search-dev" >> "$GITHUB_STEP_SUMMARY"
