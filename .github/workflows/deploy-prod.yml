# Production is deployed manually (repo is private: environments can't require
# reviewers). See docs/adr/0003. DEV-05.
# The checks run on a GitHub-hosted runner; only the kubectl job runs on the
# self-hosted runner inside the VM (ADR 0006).
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Commit SHA (40 hex) de la imagen ya validada en dev"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Validate input and actor
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ vars.PROD_APPROVERS }}
        run: |
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_sha debe ser un SHA de 40 hex"; exit 1; }
          [[ ",$APPROVERS," == *",$ACTOR,"* ]] || { echo "::error::$ACTOR no está en PROD_APPROVERS"; exit 1; }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the SHA is on main and its image build passed
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$IMAGE_SHA" origin/main || { echo "::error::$IMAGE_SHA no está en main"; exit 1; }
          ok=$(gh run list --workflow app-delivery.yml --commit "$IMAGE_SHA" --status success --json databaseId --jq length)
          [ "$ok" -gt 0 ] || { echo "::error::No hay build exitoso de la imagen para $IMAGE_SHA"; exit 1; }

  deploy-prod:
    needs: verify
    runs-on: [self-hosted, linux, k3s-cluster]
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.image_sha }}
          persist-credentials: false

      # The runner is persistent: kubectl's discovery cache from an earlier run does not
      # know CRDs installed later (PodMonitor -> "no matches for kind"). Fresh per job.
      - name: Use a per-job kubectl cache
        run: echo "KUBECACHEDIR=$RUNNER_TEMP/kube-cache" >> "$GITHUB_ENV"

      # The runner's own kubeconfig only reaches search-dev. The search-prod token is a
      # `production` environment secret (usable only from main) and lives in a
      # temporary kubeconfig for this job only.
      - name: Set up temporary prod kubeconfig
        env:
          KUBE_PROD_TOKEN: ${{ secrets.KUBE_PROD_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$KUBE_PROD_TOKEN" ] || { echo "::error::Falta el secret KUBE_PROD_TOKEN en el environment production"; exit 1; }
          CA=$(kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}')
          KCFG="$RUNNER_TEMP/kubeconfig-prod"
          umask 077
          cat > "$KCFG" <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: k3s
            cluster: { server: https://127.0.0.1:6443, certificate-authority-data: $CA }
          users:
          - name: ci-deployer-prod
            user: { token: $KUBE_PROD_TOKEN }
          contexts:
          - name: prod
            context: { cluster: k3s, user: ci-deployer-prod, namespace: search-prod }
          current-context: prod
          EOF
          echo "KUBECONFIG=$KCFG" >> "$GITHUB_ENV"

      - name: Deploy image to search-prod
        env:
          NS: search-prod
          IMAGE_SHA: ${{ inputs.image_sha }}
          OWNER: ${{ github.repository_owner }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          AUTH_TOKENS_JSON: ${{ secrets.AUTH_TOKENS_JSON }}
        run: |
          set -euo pipefail
          cd deploy/overlays/prod
          cat >> kustomization.yaml <<EOF
          images:
            - name: ghcr.io/leviuuuwwu/search-api
              newName: ghcr.io/${OWNER}/search-api
              newTag: ${IMAGE_SHA}
          EOF

          # DATABASE_URL con la contraseña codificada para URL (base64 trae / + =).

          DATABASE_URL="$(../../scripts/database-url.sh)"


          # 1. Secrets (idempotente)
          kubectl -n "$NS" create secret generic postgres-credentials \
            --from-literal=POSTGRES_USER=search \
            --from-literal=POSTGRES_DB=search \
            --from-literal=POSTGRES_PASSWORD="$PG_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NS" create secret generic app-secrets \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=AUTH_TOKENS_JSON="$AUTH_TOKENS_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. El Job es inmutable: se borra antes de volver a aplicarlo
          kubectl -n "$NS" delete job db-migration --ignore-not-found=true

          # 3. Manifiestos; PostgreSQL primero, luego migraciones, luego la app
          kubectl apply -k .
          kubectl -n "$NS" rollout status statefulset/postgres --timeout=120s
          kubectl -n "$NS" wait --for=condition=complete --timeout=120s job/db-migration
          kubectl -n "$NS" rollout status deployment/search-api --timeout=120s
          kubectl -n "$NS" rollout status deployment/search-indexer --timeout=120s

      # The app does not depend on the observability stack: the PodMonitor is applied
      # only if its CRD exists; otherwise the run gets a visible warning.
      - name: Apply PodMonitor (if the CRD is installed)
        env:
          NS: search-prod
        run: |
          echo "monitoring.coreos.com resources visible to this runner:"
          kubectl api-resources --api-group=monitoring.coreos.com -o name || true
          if kubectl api-resources --api-group=monitoring.coreos.com -o name | grep -qx 'podmonitors.monitoring.coreos.com'; then
            kubectl -n "$NS" apply -f deploy/monitoring/pod-monitor.yaml
          else
            echo "::warning::CRD PodMonitor no instalado: Prometheus no recolecta la app (revisar kube-prometheus-stack, infra/scripts/platform-install.sh)"
          fi

      # On failure, print state, events and logs (4.1 "Diagnóstico"). Read-only; runs
      # before the temporary kubeconfig is removed.
      - name: Diagnose on failure
        if: failure()
        env:
          NS: search-prod
        run: deploy/scripts/diagnose.sh "$NS"

      - name: Remove temporary prod kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig-prod"

      - name: Summary
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          ACTOR: ${{ github.actor }}
        run: echo "Desplegado \`$IMAGE_SHA\` en search-prod por @$ACTOR" >> "$GITHUB_STEP_SUMMARY"
