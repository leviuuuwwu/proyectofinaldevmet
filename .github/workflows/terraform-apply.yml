# Apply de Terraform en main (DEV-08) con aprobación humana. El repo es privado
# en una cuenta personal, donde GitHub no permite required reviewers en
# environments, así que se usa el mismo patrón que deploy-prod.yml (ADR 0003):
# solo ejecución manual desde main y solo por alguien en vars.PROD_APPROVERS.
# El environment terraform-prod se mantiene porque el subject OIDC del
# federated credential depende de él. Aplica únicamente el plan guardado en
# archivo, nunca -auto-approve. Autenticación con Azure solo vía OIDC.
name: terraform-apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: terraform-prod
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - name: Validate actor
        env:
          ACTOR: ${{ github.actor }}
          APPROVERS: ${{ vars.PROD_APPROVERS }}
        run: |
          [[ ",$APPROVERS," == *",$ACTOR,"* ]] || { echo "::error::$ACTOR no está en PROD_APPROVERS"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      - name: terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_BACKEND_RESOURCE_GROUP_NAME }}" \
            -backend-config="storage_account_name=${{ secrets.TF_BACKEND_STORAGE_ACCOUNT_NAME }}" \
            -backend-config="container_name=${{ secrets.TF_BACKEND_CONTAINER_NAME }}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: terraform plan
        working-directory: infra
        env:
          TF_VAR_admin_ip: ${{ vars.TF_VAR_ADMIN_IP }}
          TF_VAR_extra_admin_ips: ${{ vars.TF_VAR_EXTRA_ADMIN_IPS || '[]' }}
          TF_VAR_admin_ssh_public_key: ${{ secrets.TF_VAR_ADMIN_SSH_PUBLIC_KEY }}
          TF_VAR_k3s_install_script_sha256: ${{ vars.TF_VAR_K3S_INSTALL_SCRIPT_SHA256 }}
        run: terraform plan -no-color -input=false -out=tfplan.binary

      - name: terraform apply
        working-directory: infra
        run: terraform apply -input=false tfplan.binary
