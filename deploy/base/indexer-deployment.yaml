apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  labels:
    app: search-indexer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-indexer
  template:
    metadata:
      labels:
        app: search-indexer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: indexer
          image: ghcr.io/leviuuuwwu/search-api:latest
          command: ["node", "dist/indexer.js"]
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
