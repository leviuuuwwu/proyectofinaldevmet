apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demo-api-monitor
  namespace: devops-demo
  labels:
    app: demo-api
    release: prometheus
spec:
  selector:
    matchLabels:
      app: demo-api
  endpoints:
  - port: http
    path: /metrics
    interval: 15s
    scrapeTimeout: 10s
