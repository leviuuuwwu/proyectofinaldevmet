apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: search-dev

resources:
  - ../../base

# Configuración no secreta del ambiente (runtime.md). Los secretos van en app-secrets,
# que crea el workflow de despliegue desde los secrets del environment de GitHub.
configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=dev
      - LOG_LEVEL=info
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318
